services:
  - type: web
    name: bana-intranet
    env: docker
    plan: free
    repo: https://github.com/Bordache/bana-intranet
    branch: main
    rootDir: /
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: 66.9.179.173
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: bana_intranet
      - key: DB_USERNAME
        value: admin
      - key: DB_PASSWORD
        value: Bana-admin1
